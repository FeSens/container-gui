<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="box" x1="160" y1="140" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="screen" x1="180" y1="180" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Container box (shipping container shape) -->
  <rect x="126" y="150" width="260" height="200" rx="20" fill="url(#box)" opacity="0.9"/>
  <!-- Container ridges -->
  <line x1="190" y1="150" x2="190" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="150" x2="256" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="322" y1="150" x2="322" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <!-- Screen/window overlay -->
  <rect x="156" y="180" width="200" height="120" rx="8" fill="url(#screen)"/>
  <!-- Terminal lines on screen -->
  <rect x="172" y="200" width="60" height="4" rx="2" fill="#00d2ff" opacity="0.8"/>
  <rect x="172" y="214" width="100" height="4" rx="2" fill="#e94560" opacity="0.6"/>
  <rect x="172" y="228" width="80" height="4" rx="2" fill="#00d2ff" opacity="0.5"/>
  <rect x="172" y="242" width="120" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="172" y="256" width="50" height="4" rx="2" fill="#00d2ff" opacity="0.6"/>
  <rect x="172" y="270" width="90" height="4" rx="2" fill="#e94560" opacity="0.4"/>
  <!-- macOS traffic lights -->
  <circle cx="172" cy="192" r="4" fill="#ff5f57"/>
  <circle cx="184" cy="192" r="4" fill="#febc2e"/>
  <circle cx="196" cy="192" r="4" fill="#28c840"/>
  <!-- Apple logo hint (leaf) -->
  <path d="M390 160 Q400 130 380 120 Q370 140 390 160Z" fill="#28c840" opacity="0.7"/>
</svg>
